services:
  - type: web
    name: thai-legal-research
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MCP_TRANSPORT
        value: http
      - key: MCP_HOST
        value: 0.0.0.0
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: HTTP_TIMEOUT
        value: "30"
      - key: MAX_RESULTS
        value: "10"
